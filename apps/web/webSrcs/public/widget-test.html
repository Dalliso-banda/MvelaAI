<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Widget test website</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 20px;color:#0F172A}h1{color:#0B1F44}</style></head>
<body>
  <h1>Sample customer website</h1>
  <p>This page pretends to be your company's site. If the widget is published, a chat bubble appears in the bottom-right corner.</p>
  <p id="status" style="color:#64748B"></p>
  <script>
    var key = new URLSearchParams(location.search).get('key');
    var s = document.createElement('script');
    s.src = '/widget.js'; s.async = true; s.setAttribute('data-key', key || '');
    document.body.appendChild(s);
    document.getElementById('status').textContent = key ? 'Widget key: ' + key : 'Add ?key=YOUR_KEY to the address.';
  </script>
</body></html>
